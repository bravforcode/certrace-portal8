name: certrace
services:
  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: certrace
      POSTGRES_USER: certrace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DATABASE_PORT:-55432}:5432"
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U certrace -d certrace"]
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    build:
      context: .
      dockerfile: certrace-backend/Dockerfile
      target: migrate
    restart: "no"
    environment:
      DATABASE_URL: postgresql://certrace:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@database:5432/certrace
    depends_on:
      database:
        condition: service_healthy
  backend:
    build:
      context: .
      dockerfile: certrace-backend/Dockerfile
      target: runtime
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://certrace:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@database:5432/certrace
      PORT: "8000"
      CERTRACE_APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      CERTRACE_CORS_ALLOWED_ORIGINS: ${APP_BASE_URL:-http://localhost:3000}
      CERTRACE_JWT_SECRET: ${CERTRACE_JWT_SECRET:?set CERTRACE_JWT_SECRET in .env}
      CERTRACE_EMAIL_DELIVERY: ${CERTRACE_EMAIL_DELIVERY:-console}
      CERTRACE_FILE_STORAGE: ${CERTRACE_FILE_STORAGE:-database}
      NODE_ENV: development
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://localhost:8000/readyz');process.exit(r.ok?0:1)"]
      interval: 10s
      timeout: 5s
      retries: 20
  frontend:
    build:
      context: .
      dockerfile: certrace-portal/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: /backend
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${CERTRACE_GOOGLE_CLIENT_ID:-}
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
volumes:
  database:
