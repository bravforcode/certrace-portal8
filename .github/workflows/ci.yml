name: CI

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  portal:
    name: Portal checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: certrace-portal
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: certrace-portal/package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:unit

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build Next.js application
        run: npm run build

      - name: Build OpenNext Cloudflare artifact
        run: npm run build-pages

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright readiness-demo tests
        run: npm run test:e2e -- --project=chromium

      - name: Upload Playwright diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portal-playwright-results
          path: |
            certrace-portal/playwright-report/
            certrace-portal/test-results/
          if-no-files-found: ignore
          retention-days: 7

  admin:
    name: Admin checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: certrace-admin-portal
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: certrace-admin-portal/package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build Next.js application
        run: npm run build

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: certrace-backend
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            certrace-backend/requirements.txt
            certrace-backend/requirements-test.txt

      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-test.txt
          python -m pip install ruff==0.15.8 pip-audit==2.10.1

      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff format check
        run: python -m ruff format --check .

      - name: Run FastAPI tests
        run: python -m pytest -q

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Audit runtime requirements
        run: python -m pip_audit -r requirements.txt

      - name: Audit runtime and test requirements
        run: python -m pip_audit -r requirements-test.txt

  security:
    name: Code and secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Scan tracked source for high-confidence secrets
        shell: bash
        run: |
          if git grep -I -n -E '(AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9_]{30,}|sk-[A-Za-z0-9]{32,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' -- .; then
            echo "High-confidence secret pattern found in tracked source."
            exit 1
          fi

      - name: Initialize CodeQL
        uses: github/codeql-action/init@641a925cfafe92d0fdf8b239ba4053e3f8d99d6d # v3
        with:
          languages: javascript-typescript,python

      - name: Analyze source
        uses: github/codeql-action/analyze@641a925cfafe92d0fdf8b239ba4053e3f8d99d6d # v3
