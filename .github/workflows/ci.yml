name: CI

# The repo is private on the Free plan: 2,000 runner minutes a month, billed
# per job and rounded up per job. The full suite is five jobs (~17 billed
# minutes), and in September it ran on every pull_request event, then again
# on the push when the PR merged, then again on the push to any fix/** branch
# that already had a PR. The quota was gone by the 10th. So this workflow runs
# once per change, and only the jobs the change can break:
#
#   * pull_request only. GitHub builds a PR as its merge commit with the base,
#     so the push that merges it tests a tree that was already tested. A push
#     straight to main is not checked; run this by hand (workflow_dispatch)
#     when you need main itself verified.
#   * Drafts are skipped until they are marked ready.
#   * `changes` reads the diff and switches on only the jobs whose app it
#     touches. workflow_dispatch switches on everything.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  # Always runs, and costs one billed minute, so it also carries the secret
  # scan: that check is a single git grep and should run on every change,
  # whichever app it touches.
  changes:
    name: Pick checks and scan for secrets
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      portal: ${{ steps.pick.outputs.portal }}
      landing: ${{ steps.pick.outputs.landing }}
      backend: ${{ steps.pick.outputs.backend }}
      codeql: ${{ steps.pick.outputs.codeql }}
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # A pull_request checks out GitHub's merge commit. Its first parent
          # is the base branch tip, so HEAD^1..HEAD is exactly what the PR
          # adds, and one commit of extra history is all that takes.
          fetch-depth: 2

      - name: Scan tracked source for high-confidence secrets
        shell: bash
        run: |
          if git grep -I -n -E '(AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9_]{30,}|sk-[A-Za-z0-9]{32,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' -- .; then
            echo "High-confidence secret pattern found in tracked source."
            exit 1
          fi

      - name: Pick the jobs this change needs
        id: pick
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "Run by hand: every check is on."
            {
              echo "portal=true"
              echo "landing=true"
              echo "backend=true"
              echo "codeql=javascript-typescript,python"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only HEAD^1 HEAD)"
          echo "Files this pull request changes:"
          sed 's/^/  /' <<<"$changed"

          touched() { if grep -qE "$1" <<<"$changed"; then echo true; else echo false; fi; }

          # An edit to this file can break any job, so it switches on all of
          # them. The golden fixture is read by both calculation engines'
          # parity tests (see docs/fixtures/README.md), so it counts as both.
          self='^\.github/workflows/ci\.yml$'
          fixture='^docs/fixtures/'
          portal="$(touched "^certrace-portal/|$fixture|$self")"
          landing="$(touched "^landingpage/|$self")"
          backend="$(touched "^certrace-backend/|$fixture|$self")"

          # CodeQL is the most expensive job (4-8 minutes), and it analyzes a
          # whole language whether or not the diff touched it. So only the
          # languages the diff actually contains get analyzed. It also runs
          # only on PRs into main: a PR stacked on another branch gets scanned
          # when the stack reaches main, where the diff-informed run covers
          # every commit in the stack at once.
          languages=()
          if [ "$GITHUB_BASE_REF" = "main" ]; then
            if [ "$(touched "$self")" = true ]; then
              languages=(javascript-typescript python)
            else
              if [ "$(touched '\.(js|jsx|mjs|cjs|ts|tsx|mts|cts|html)$')" = true ]; then
                languages+=(javascript-typescript)
              fi
              if [ "$(touched '\.py$')" = true ]; then
                languages+=(python)
              fi
            fi
          fi
          codeql="$(IFS=,; echo "${languages[*]}")"

          echo "portal=$portal landing=$landing backend=$backend codeql=${codeql:-none}"
          {
            echo "portal=$portal"
            echo "landing=$landing"
            echo "backend=$backend"
            echo "codeql=$codeql"
          } >> "$GITHUB_OUTPUT"

  portal:
    name: Portal checks
    needs: changes
    if: ${{ needs.changes.outputs.portal == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: certrace-portal
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: certrace-portal/package-lock.json

      # There used to be a separate "unit tests on Node 22 (minimum supported)"
      # job. It also asked setup-node for `22`, so it ran the same Node as
      # this job and never tested the floor, while costing a runner of its
      # own. The engines check it carried costs a millisecond, so it moved
      # here. A Node below the floor strips no types, and `node --test` then
      # fails with a syntax error that says nothing about Node versions.
      - name: Verify the runner meets the engines floor
        run: node scripts/check-node-version.mjs

      - name: Install locked dependencies
        run: npm ci --no-audit

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:unit

      - name: Audit production dependencies
        # Blocks on critical only. Known accepted risk: brace-expansion DoS
        # (GHSA via exceljs->archiver->glob->minimatch) — exceljs runs
        # browser-side for client file downloads; the filesystem globbing
        # path that triggers the advisory never executes. Old minimatch
        # majors pin brace-expansion <2, so no compatible patched version
        # exists without breaking the build. High findings stay visible in
        # the non-blocking report step below.
        run: npm audit --omit=dev --audit-level=critical

      - name: Audit report (non-blocking, all levels)
        run: npm audit --omit=dev || true

      - name: Build Next.js application
        run: npm run build

      - name: Build OpenNext Cloudflare artifact
        run: npm run build-pages

      - name: Verify security headers shipped in the build output
        # public/_headers is what protects the pages Cloudflare serves from
        # the asset layer without ever invoking the Worker. If a build stops
        # copying it, next.config.ts still looks correct and production
        # silently goes back to shipping unprotected HTML — which is exactly
        # how the site ended up at 5/100 on Observatory. Fail here instead.
        run: |
          asset_headers=".vercel/output/static/_headers"
          if [ ! -f "$asset_headers" ]; then
            echo "::error::$asset_headers missing — deployed pages would carry no security headers."
            exit 1
          fi
          for header in Content-Security-Policy Strict-Transport-Security X-Content-Type-Options X-Frame-Options; do
            if ! grep -q "$header" "$asset_headers"; then
              echo "::error::$header missing from $asset_headers"
              exit 1
            fi
          done

          # The prerendered pages are the ones the asset layer serves, and
          # nothing can mint them a nonce, so scripts/build-csp-headers.mjs
          # hashes their inline scripts instead. A policy that fell back to
          # 'unsafe-inline' would still look like a CSP in every check above
          # while allowing any injected inline script to run — Observatory
          # scored that -20. Both halves are asserted: no way out, and the
          # hashes actually there.
          # Comment lines in the file discuss 'unsafe-inline' by name, so read
          # the rules only.
          if grep -v "^[[:space:]]*#" "$asset_headers" | grep -o "script-src[^;]*" | grep -q "unsafe-inline"; then
            echo "::error::script-src allows 'unsafe-inline' in $asset_headers — the script policy is decorative."
            exit 1
          fi
          if ! grep -q "sha256-" "$asset_headers"; then
            echo "::error::no inline-script hashes in $asset_headers — did build-csp-headers.mjs run?"
            exit 1
          fi
          for route in "^/$" "^/login$"; do
            if ! grep -qE "$route" "$asset_headers"; then
              echo "::error::no per-page rule matching $route in $asset_headers — that page would ship with no policy."
              exit 1
            fi
          done
          echo "Security headers present in $asset_headers."


  landing:
    name: Landing page checks
    needs: changes
    if: ${{ needs.changes.outputs.landing == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: landingpage/certrace-landing
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landingpage/certrace-landing/package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit

      - name: Lint
        # This app had no ESLint config until now, so `next lint` fell into an
        # interactive setup prompt and could never run here. It uses `eslint .`
        # and the same rule set as both portals.
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

      - name: Audit report (non-blocking, all levels)
        run: npm audit --omit=dev || true

      - name: Build Next.js application
        run: npm run build

      - name: Build OpenNext Cloudflare artifact
        run: npm run build-pages

      - name: Verify security headers shipped in the build output
        run: |
          asset_headers=".open-next/assets/_headers"
          if [ ! -f "$asset_headers" ]; then
            echo "::error::$asset_headers missing — deployed pages would carry no security headers."
            exit 1
          fi
          for header in Content-Security-Policy Strict-Transport-Security X-Content-Type-Options X-Frame-Options; do
            if ! grep -q "$header" "$asset_headers"; then
              echo "::error::$header missing from $asset_headers"
              exit 1
            fi
          done

          # Documents on this app are rendered by the Worker, where
          # middleware.ts answers each one with a nonce, so the policy here
          # only ever covers assets — none of which is a document, and none of
          # which needs an inline allowance. If OpenNext ever starts writing
          # prerendered HTML into the asset directory, those pages would be
          # served under this policy with no nonce and no hashes and would
          # come up blank; they would need the portal's per-page hashes
          # (certrace-portal/scripts/build-csp-headers.mjs) instead.
          # Comment lines in the file discuss 'unsafe-inline' by name, so read
          # the rules only.
          if grep -v "^[[:space:]]*#" "$asset_headers" | grep -o "script-src[^;]*" | grep -q "unsafe-inline"; then
            echo "::error::script-src allows 'unsafe-inline' in $asset_headers — the script policy is decorative."
            exit 1
          fi
          if find "$(dirname "$asset_headers")" -name "*.html" | grep -q .; then
            echo "::error::the asset directory now holds HTML, which would be served under the asset-layer policy without a nonce or hashes."
            exit 1
          fi
          echo "Security headers present in $asset_headers."


  backend:
    name: Backend checks
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: certrace-backend
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            certrace-backend/requirements.txt
            certrace-backend/requirements-test.txt

      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-test.txt
          python -m pip install ruff==0.15.8 pip-audit==2.10.1

      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff format check
        run: python -m ruff format --check .

      - name: Run FastAPI tests
        run: python -m pytest -q

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Audit runtime requirements
        run: python -m pip_audit -r requirements.txt

      - name: Audit runtime and test requirements
        run: python -m pip_audit -r requirements-test.txt

  # The secret scan that used to open this job now runs in `changes`, on every
  # pull request.
  security:
    name: CodeQL scanning
    needs: changes
    if: ${{ needs.changes.outputs.codeql != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          languages: ${{ needs.changes.outputs.codeql }}

      - name: Analyze source
        uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          output: codeql-results
          upload: never

      - name: Fail on high-severity CodeQL findings
        shell: bash
        run: |
          python - <<'PY'
          import glob
          import json

          sarif_files = glob.glob("codeql-results/**/*.sarif", recursive=True)
          if not sarif_files:
              raise SystemExit("CodeQL produced no SARIF output.")


          # Findings reviewed and signed off as false positives, keyed on rule
          # and path, with the reason that has to hold for the entry to stay.
          #
          # This list exists because there is nowhere else to put one. CodeQL's
          # `# codeql[rule-id]` comment does not survive into this SARIF -- the
          # run that proved it left no `suppressions` entry on the result at all
          # -- and code scanning's own dismissal lives in a UI this gate cannot
          # read, so without a list the only lever is the 7.0 threshold, which
          # lowers the bar for every file at once. Every entry below is printed
          # by the job whether or not it fires, and adding one is a line in a
          # diff a reviewer has to approve.
          #
          # Deliberately coarse: rule plus path, no line number, because a line
          # number rots on the next edit. The cost is that a genuine second
          # finding of the SAME rule in the SAME file would be signed off with
          # the first. Acceptable at this size; revisit if the list grows.
          TRIAGED = {
              (
                  "py/clear-text-logging-sensitive-data",
                  "certrace-backend/app/services/email.py",
              ): (
                  "logs the NAME of the RESEND_API_KEY env var so an operator "
                  "knows what to set, never the key -- see NullTransport.send"
              ),
          }


          def path_of(result):
              location = (result.get("locations") or [{}])[0]
              return (
                  location.get("physicalLocation", {})
                  .get("artifactLocation", {})
                  .get("uri", "unknown-path")
              )


          blocking = []
          signed_off = []
          total_results = 0
          for sarif_file in sarif_files:
              with open(sarif_file, encoding="utf-8") as handle:
                  document = json.load(handle)
              for run in document.get("runs", []):
                  tool = run.get("tool", {})
                  components = [tool.get("driver", {}), *tool.get("extensions", [])]
                  rules = {
                      rule.get("id"): rule
                      for component in components
                      for rule in component.get("rules", [])
                      if rule.get("id")
                  }
                  for result in run.get("results", []):
                      total_results += 1
                      rule_id = result.get("ruleId", "unknown-rule")
                      properties = dict(rules.get(rule_id, {}).get("properties", {}))
                      properties.update(result.get("properties", {}))
                      raw_severity = properties.get("security-severity")
                      try:
                          security_severity = float(raw_severity)
                      except (TypeError, ValueError):
                          security_severity = None
                      if result.get("level") == "error" or (
                          security_severity is not None and security_severity >= 7.0
                      ):
                          location = path_of(result)
                          finding = (rule_id, security_severity, location)
                          if (rule_id, location) in TRIAGED:
                              signed_off.append(finding)
                          else:
                              blocking.append(finding)

          for rule_id, severity, location in signed_off:
              reason = TRIAGED[(rule_id, location)]
              print(f"Signed off: {rule_id} severity={severity} path={location} -- {reason}")

          # An entry that stops firing is stale. Not a failure -- a
          # diff-informed run on a pull request reports only what the diff
          # touched, so most entries legitimately miss there -- but it has to be
          # visible, or the list outlives the findings it was written for.
          stale = sorted(set(TRIAGED) - {(r, loc) for r, _, loc in signed_off})
          for rule_id, location in stale:
              print(f"::notice::triage entry did not fire: {rule_id} at {location}")

          if blocking:
              for rule_id, severity, location in blocking:
                  print(f"Blocking CodeQL finding: {rule_id} severity={severity} path={location}")
              raise SystemExit(1)
          print(
              f"CodeQL analyzed {len(sarif_files)} SARIF file(s); {total_results} result(s), "
              f"{len(signed_off)} signed off, no blocking high/critical finding."
          )
          PY

      - name: Upload CodeQL SARIF diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codeql-sarif
          path: codeql-results/
          if-no-files-found: error
          retention-days: 7
