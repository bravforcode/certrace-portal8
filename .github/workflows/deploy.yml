name: Deploy

# One merge to main ships whichever apps that merge actually touched, then asks
# the live host whether the security headers really came through. That last
# step is the point: next.config.ts declared the full header set for months
# while every prerendered page went out with none of it, because Cloudflare
# serves those from the asset layer without invoking the Worker. A deploy that
# does not verify against production cannot tell the difference.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      apps:
        description: Which apps to deploy
        type: choice
        default: changed
        options: [changed, all, landing, portal, backend]

permissions:
  contents: read

concurrency:
  # Never cancel a deploy midway — a half-shipped Worker is worse than a queue.
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Decide what to deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      any: ${{ steps.pick.outputs.any }}
      backend: ${{ steps.pick.outputs.backend }}
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Pick apps
        id: pick
        shell: bash
        env:
          REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.apps || 'changed' }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          # dir | worker | public URL used for the post-deploy header check.
          declare -A DIR=(
            [landing]="landingpage/certrace-landing"
            [portal]="certrace-portal"
          )
          declare -A URL=(
            [landing]="https://certrace.co/"
            [portal]="https://portal.certrace.co/"
          )

          # The backend is not a Cloudflare Worker: it ships to Cloud Run from its
          # own job, so it is tracked as a flag beside the matrix, never inside
          # it. An entry with no DIR/URL would build an empty Node project.
          backend=false

          selected=()
          if [ "$REQUESTED" = "all" ]; then
            selected=(landing portal)
            backend=true
          elif [ "$REQUESTED" = "backend" ]; then
            backend=true
          elif [ "$REQUESTED" != "changed" ]; then
            selected=("$REQUESTED")
          else
            # A first push, a force-push or a new branch leaves no usable base.
            # Deploy everything rather than silently shipping nothing.
            if [ -z "${BEFORE:-}" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              echo "No usable base commit — deploying every app."
              selected=(landing portal)
              backend=true
            else
              changed="$(git diff --name-only "$BEFORE" "${{ github.sha }}")"
              echo "Changed files:"; echo "$changed" | sed 's/^/  /'
              for app in landing portal; do
                if grep -q "^${DIR[$app]}/" <<<"$changed"; then selected+=("$app"); fi
              done
              if grep -q "^certrace-backend/" <<<"$changed"; then backend=true; fi
              # The workflow itself changing means the deploy path changed.
              if grep -q "^\.github/workflows/deploy\.yml$" <<<"$changed"; then
                selected=(landing portal)
                backend=true
              fi
            fi
          fi

          # De-duplicate while keeping order.
          mapfile -t selected < <(printf '%s\n' "${selected[@]:-}" | awk 'NF && !seen[$0]++')

          # "${selected[@]:-}" on an empty array expands to one empty string,
          # and DIR[""] under set -u aborts the job. A merge that touches only
          # docs, or a dispatch for the backend alone, selects no Worker at all
          # and has to leave here with an empty matrix, not a red X.
          entries=()
          if [ ${#selected[@]} -gt 0 ]; then
            for app in "${selected[@]}"; do
              entries+=("$(printf '{"name":"%s","dir":"%s","url":"%s"}' "$app" "${DIR[$app]}" "${URL[$app]}")")
            done
          fi
          matrix="$(printf '%s\n' "${entries[@]:-}" | paste -sd, -)"
          matrix="{\"include\":[${matrix}]}"

          echo "Deploying apps: ${selected[*]:-(nothing)}"
          echo "Deploying backend: $backend"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "any=$([ ${#selected[@]} -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "backend=$backend" >> "$GITHUB_OUTPUT"

  backend:
    name: Deploy backend to Cloud Run
    needs: plan
    # Off unless BACKEND_HOST=cloudrun. Production's API is on Render
    # (api.certrace.co → certrace.onrender.com), which deploys itself and runs
    # `alembic upgrade head` from its start command. This job ships to a Cloud
    # Run service nothing points at, and it failed on every backend merge
    # (the deployer account cannot use Cloud Build) — a red Deploy that means
    # nothing teaches people to ignore the ones that do. Kept, not deleted, for
    # the day the host decision goes the other way.
    if: needs.plan.outputs.backend == 'true' && vars.BACKEND_HOST == 'cloudrun'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      # Workload Identity Federation: GitHub mints a short-lived OIDC token that
      # Google exchanges for credentials. No JSON service-account key is stored
      # in this repository, and nothing minted here outlives the run.
      id-token: write
    defaults:
      run:
        working-directory: certrace-backend
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION || 'asia-southeast1' }}
      SERVICE: ${{ vars.GCP_SERVICE || 'certrace-backend' }}
      REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY || 'certrace' }}
      WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      DEPLOY_SA: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      RUNTIME_SA: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
      PORTAL_ORIGIN: ${{ vars.PORTAL_ORIGIN || 'https://portal.certrace.co' }}
      API_URL: ${{ vars.API_URL || 'https://api.certrace.co' }}
      EMAIL_SENDER: ${{ vars.CERTRACE_EMAIL_SENDER || 'Certrace <contact@certrace.co>' }}
      EMAIL_REPLY_TO: ${{ vars.CERTRACE_EMAIL_REPLY_TO || 'contact@certrace.co' }}
      # Sign in with Google. Public (it is in every sign-in URL), so a variable,
      # not a secret. Unset: /api/auth/google answers 503 and the portal hides
      # the button — the same value has to reach both.
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID || '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Decide whether Cloud Run is wired up yet
        id: gate
        shell: bash
        run: |
          # Until someone provisions the GCP side, a backend change must not
          # fail every merge to main. Skip loudly instead: the moment these
          # variables exist, this job starts shipping with no further edit.
          missing=()
          [ -n "${PROJECT_ID:-}" ] || missing+=(GCP_PROJECT_ID)
          [ -n "${WIF_PROVIDER:-}" ] || missing+=(GCP_WORKLOAD_IDENTITY_PROVIDER)
          [ -n "${DEPLOY_SA:-}" ] || missing+=(GCP_DEPLOY_SERVICE_ACCOUNT)
          [ -n "${RUNTIME_SA:-}" ] || missing+=(GCP_RUNTIME_SERVICE_ACCOUNT)

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::notice title=Backend not deployed::Skipping Cloud Run. Missing repository variables: ${missing[*]}. See certrace-backend/README.md, Deploy to Google Cloud Run."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python 3.13
        if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            certrace-backend/requirements.txt
            certrace-backend/requirements-test.txt

      - name: Install runtime and test dependencies
        if: steps.gate.outputs.ready == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-test.txt

      - name: Run FastAPI tests
        if: steps.gate.outputs.ready == 'true'
        # The same gate the portal and landing jobs apply: nothing ships that
        # cannot pass its own suite, even though CI already ran it on the PR.
        run: python -m pytest -q

      - name: Authenticate to Google Cloud
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v gcloud >/dev/null; then
            echo "::error::gcloud is missing from this runner image. Pin google-github-actions/setup-gcloud by SHA if that ever changes."
            exit 1
          fi

          # Exchange the run's OIDC token for Google credentials. Both files are
          # runner-local, never echoed, and die with the workspace.
          curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://iam.googleapis.com/${WIF_PROVIDER}" \
            | python -c 'import json,sys; sys.stdout.write(json.load(sys.stdin)["value"])' \
            > "${RUNNER_TEMP}/oidc-token"

          gcloud iam workload-identity-pools create-cred-config "${WIF_PROVIDER}" \
            --service-account="${DEPLOY_SA}" \
            --credential-source-file="${RUNNER_TEMP}/oidc-token" \
            --output-file="${RUNNER_TEMP}/gcp-credentials.json"

          gcloud auth login --cred-file="${RUNNER_TEMP}/gcp-credentials.json" --quiet
          gcloud config set project "${PROJECT_ID}" --quiet
          gcloud auth list

      - name: Build an immutable image
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Tagged with the commit, never :latest — the migration job and the
          # serving revision have to be provably the same build.
          image="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${SERVICE}:${GITHUB_SHA::7}"
          gcloud builds submit --quiet --tag "$image" .
          echo "IMAGE_TAG=$image" >> "$GITHUB_ENV"

      - name: Migrate the database
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Alembic runs as its own job on that same image, never in the web
          # container's start command: a failed migration must not take the
          # serving revision down with it. migrations/env.py imports the models
          # and not create_app, so no signing key is bound here.
          gcloud run jobs deploy "${SERVICE}-migrate" \
            --quiet \
            --image="${IMAGE_TAG}" \
            --region="${REGION}" \
            --service-account="${RUNTIME_SA}" \
            --set-secrets="DATABASE_URL=certrace-database-url:latest" \
            --command=python --args=-m,alembic,upgrade,head \
            --max-retries=1 --task-timeout=10m
          gcloud run jobs execute "${SERVICE}-migrate" --region="${REGION}" --wait

      - name: Deploy the service
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # ^|^ switches --set-env-vars to a pipe delimiter, because the sender
          # address contains a comma and the default delimiter splits it in half.
          #
          # CERTRACE_APP_BASE_URL is the value with no error mode: a wrong one
          # still starts and passes every probe, and mints supplier smart links
          # nobody can open. Its default is now the live portal, and GET /
          # reports it as appBaseUrl. The portal is what serves /s/<token>.
          gcloud run deploy "${SERVICE}" \
            --quiet \
            --image="${IMAGE_TAG}" \
            --region="${REGION}" \
            --service-account="${RUNTIME_SA}" \
            --allow-unauthenticated \
            --set-secrets="DATABASE_URL=certrace-database-url:latest,CERTRACE_JWT_SECRET=certrace-jwt-secret:latest,RESEND_API_KEY=certrace-resend-api-key:latest" \
            --set-env-vars="^|^CERTRACE_CORS_ALLOWED_ORIGINS=${PORTAL_ORIGIN}|CERTRACE_APP_BASE_URL=${PORTAL_ORIGIN}|CERTRACE_REQUIRE_DATABASE=true|CERTRACE_ENABLE_API_DOCS=false|CERTRACE_EMAIL_DELIVERY=resend|CERTRACE_EMAIL_SENDER=${EMAIL_SENDER}|CERTRACE_EMAIL_REPLY_TO=${EMAIL_REPLY_TO}|DATABASE_POOL_SIZE=2|DATABASE_MAX_OVERFLOW=0|CERTRACE_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}" \
            --cpu=1 --memory=512Mi --concurrency=8 \
            --min=0 --max=3 \
            --startup-probe="httpGet.path=/healthz,initialDelaySeconds=0,timeoutSeconds=3,periodSeconds=5,failureThreshold=12"

      - name: Verify the live API answers on its own domain
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          set -uo pipefail
          # The service URL proves the revision came up. api.certrace.co proves
          # the domain mapping and the record in front of it still point here —
          # the failure that catches is a 403 from an edge with nothing behind
          # it, which reads like the application rejecting the call.
          service_url="$(gcloud run services describe "${SERVICE}" --region="${REGION}" --format='value(status.url)')"
          for url in "$service_url" "$API_URL"; do
            code=000
            for attempt in 1 2 3 4 5 6; do
              code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "${url}/readyz")" || code=000
              if [ "$code" = "200" ]; then
                echo "${url}/readyz — 200 after $attempt attempt(s)"
                break
              fi
              echo "attempt $attempt: ${url}/readyz returned $code"
              sleep 10
            done
            if [ "$code" != "200" ]; then
              echo "::error title=Backend deployed but not answering::${url}/readyz returned $code"
              echo "503 from the service URL is the database: CERTRACE_REQUIRE_DATABASE=true and the pooled URI is unreachable."
              echo "403 on ${API_URL} is the edge: the Cloud Run domain mapping or the DNS record is missing (certrace-backend/README.md)."
              exit 1
            fi
          done

          # A preflight the portal's real origin can pass. Without this the
          # first symptom is a login that fails in the browser with nothing
          # whatsoever in the server log.
          allow="$(curl -sS -o /dev/null -D - --max-time 30 -X OPTIONS "${API_URL}/api/auth/login" \
            -H "Origin: ${PORTAL_ORIGIN}" -H 'Access-Control-Request-Method: POST' \
            | tr -d '\r' | grep -i '^access-control-allow-origin:')" || allow=""
          if [ -z "$allow" ]; then
            echo "::error title=CORS blocks the portal::${API_URL} did not allow ${PORTAL_ORIGIN}."
            echo "CERTRACE_CORS_ALLOWED_ORIGINS must list that exact origin — scheme and host, no path, no wildcard."
            exit 1
          fi
          echo "$allow"

  deploy:
    name: Deploy ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Fail early if Cloudflare credentials are missing
        # wrangler's own failure for this is buried in a stack trace, and it
        # surfaces only after a full production build has already run.
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Fail early if the portal has no backend to point at
        # No default on purpose: a wrong-but-plausible URL baked into the bundle
        # is worse than a red X, because the build succeeds and the breakage
        # only shows up in someone's browser. An unset secret stops the deploy
        # here instead of shipping a portal whose every API call goes nowhere.
        #
        # `if:` tests the matrix, not the secret — the `secrets` context is not
        # available in step conditions, which is why the emptiness check is a
        # shell test on an env var rather than part of the `if` above.
        if: matrix.name == 'portal'
        env:
          API_BASE: ${{ secrets.API_URL }}
        run: |
          if [ -z "${API_BASE:-}" ]; then
            echo "::error title=API_URL is not set::The portal build needs it — add the API_URL secret (Settings → Secrets and variables → Actions → Secrets) set to https://api.certrace.co."
            exit 1
          fi
          # Nothing derived from the value is echoed: masking only covers the
          # exact string, so printing a slice of it would defeat the point of
          # keeping it a secret. The shape check is what this step can report.
          case "$API_BASE" in
            https://*) echo "API_URL is set and is an https origin." ;;
            *) echo "::error title=API_URL is not an https URL::The value must start with https:// — a bare host or an http:// origin bakes a broken URL into the bundle."; exit 1 ;;
          esac

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Run unit tests
        run: npm run test:unit --if-present

      - name: Deploy to Cloudflare
        env:
          # This has to be here, in the BUILD environment, and nowhere else.
          # Next inlines NEXT_PUBLIC_* into the bundle while `npm run deploy`
          # builds; the same name in wrangler.jsonc `vars` would arrive at
          # request time and change nothing. Shipped unset, the portal built
          # with apiConfigured() === false, and /login signed in anyone who
          # typed a password. Landing has no backend, so it gets an empty value.
          NEXT_PUBLIC_API_BASE_URL: ${{ matrix.name == 'portal' && secrets.API_URL || '' }}
          # Must be the same client id the backend verifies against (see the
          # backend job). Empty hides the Google button.
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ matrix.name == 'portal' && vars.GOOGLE_CLIENT_ID || '' }}
        run: npm run deploy

      - name: Verify the live response carries the security headers
        shell: bash
        env:
          URL: ${{ matrix.url }}
        run: |
          set -uo pipefail
          if [ -z "${URL:-}" ]; then
            echo "No public URL configured for ${{ matrix.name }} — skipping verification."
            echo "Set the EXPORTER_PORTAL_URL repository variable to enable it."
            exit 0
          fi

          required=(content-security-policy strict-transport-security
                    x-content-type-options x-frame-options referrer-policy)

          # Cloudflare needs a moment to pick up a new deployment, so give the
          # edge a few tries before calling it a failure.
          for attempt in 1 2 3 4 5 6; do
            headers="$(curl -sS --max-time 30 -D - -o /dev/null -L "$URL" \
              | tr -d '\r' | tr '[:upper:]' '[:lower:]')" || headers=""

            missing=()
            for header in "${required[@]}"; do
              grep -q "^${header}:" <<<"$headers" || missing+=("$header")
            done

            if [ ${#missing[@]} -eq 0 ]; then
              # Presence is not strength: a script-src that still allows
              # 'unsafe-inline' passes every check above while leaving an
              # injected inline script free to run. Prerendered pages carry
              # per-page hashes instead (certrace-portal/scripts/build-csp-headers.mjs),
              # Worker-rendered ones a nonce, so neither has an excuse for it.
              script_src="$(grep -m1 '^content-security-policy:' <<<"$headers" \
                | sed -n 's/.*script-src\([^;]*\).*/\1/p')"
              if grep -q "unsafe-inline" <<<"$script_src"; then
                echo "::error title=Decorative CSP::$URL script-src allows 'unsafe-inline':$script_src"
                exit 1
              fi
              echo "$URL — all required headers present after $attempt attempt(s); script-src:$script_src"
              exit 0
            fi

            echo "attempt $attempt: still missing ${missing[*]}"
            sleep 10
          done

          echo "::error title=Deployed but unprotected::$URL is missing: ${missing[*]}"
          echo "The deploy succeeded, so this is a serving problem, not a build one."
          echo "public/_headers is what covers pages served from the Cloudflare asset layer."
          echo "Response headers received:"
          echo "$headers"
          exit 1
