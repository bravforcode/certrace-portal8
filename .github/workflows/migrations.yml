name: Database migrations
on:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  migration-tests:
    name: Migration tests (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: local Compose
            compose-file: compose.yaml
          - target: production Compose
            compose-file: docker-compose-prod.yml
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - name: Existing migration files are immutable
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-only --diff-filter=MDTR "$BASE_SHA" HEAD -- certrace-backend/prisma/migrations)
          if [ -n "$changed" ]; then
            echo "Do not modify or remove existing migrations. Add a new migration:"
            echo "$changed"
            exit 1
          fi
      - uses: docker/setup-buildx-action@v3
      - name: Load cached migration test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: certrace-backend/Dockerfile
          target: migrate
          load: true
          tags: certrace-migration-tests:ci
          cache-from: |
            type=gha,scope=migration-tests-amd64
            type=gha,scope=migrate-amd64
          cache-to: type=gha,scope=migration-tests-amd64,mode=max
      - name: Test migrations and Compose startup gates
        env:
          TEST_COMPOSE_FILE: ${{ matrix.compose-file }}
          CERTRACE_MIGRATION_TEST_IMAGE: certrace-migration-tests:ci
        run: bun scripts/test-migrations.ts "$TEST_COMPOSE_FILE"
      - name: Install backend dependencies for preservation rehearsal
        if: matrix.target == 'local Compose'
        run: bun install --frozen-lockfile --filter @certrace/backend
      - name: Generate compact Prisma client
        if: matrix.target == 'local Compose'
        run: bun run db:generate
      - name: Verify user and onboarding preservation with compact storage
        if: matrix.target == 'local Compose'
        env:
          CERTRACE_MIGRATION_TEST_IMAGE: certrace-migration-tests:ci
        run: bun --no-env-file run test:verification-schema
